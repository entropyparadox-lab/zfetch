name: CI & Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Code Style & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Check Formatting
        run: zig fmt --check src/ examples/ build.zig build.zig.zon

      - name: Verify Version Consistency
        run: |
          ZON_VER=$(grep -oP '\.version\s*=\s*"\K[^"]+' build.zig.zon)
          echo "build.zig.zon version: $ZON_VER"
          if [ -z "$ZON_VER" ]; then
            echo "Error: Version not found in build.zig.zon"
            exit 1
          fi

  test-matrix:
    name: Test on ${{ matrix.os }}
    needs: lint-and-format
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Run Unit Tests
        run: zig build test

      - name: Build
        run: zig build

      - name: Isolated HTTP and package archive consumer smoke
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run isolated HTTP and package archive consumer smoke
        run: python3 tests/smoke.py --work-dir "${{ runner.temp }}/zfetch-smoke"
